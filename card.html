<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <style>
        body {
            background-color: #0b0b0f;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .card {
            background-color: #12121a;
            border: 1px solid #222230;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .header {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 20px;
            text-align: center;
            color: #a5b4fc;
        }
        .item {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            font-size: 16px;
            word-break: break-all;
        }
        .icon {
            margin-right: 12px;
            font-size: 20px;
        }
        a {
            color: white;
            text-decoration: none;
        }
        a:hover {
            color: #a5b4fc;
            text-decoration: underline;
        }
        .call-btn {
            display: block;
            width: 100%;
            background-color: #4f46e5;
            color: white;
            text-align: center;
            padding: 12px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            margin-top: 20px;
            text-decoration: none;
            box-sizing: border-box;
            transition: background-color 0.2s;
        }
        .call-btn:hover {
            background-color: #4338ca;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header">Digital Business Card</div>
        <div class="item"><span class="icon">👤</span><span id="name">Loading...</span></div>
        <div class="item"><span class="icon">📞</span><a id="phone-link" href="#"><span id="phone">Loading...</span></a></div>
        <div class="item"><span class="icon">✉️</span><a id="email-link" href="#"><span id="email">Loading...</span></a></div>
        <div class="item"><span class="icon">💼</span><span id="company">Loading...</span></div>
        
        <!-- Dedicated Call Button -->
        <a id="call-action-btn" class="call-btn" href="#">📞 Call Now</a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        
        const name = params.get('name') || 'N/A';
        const phone = params.get('phone') || 'N/A';
        const email = params.get('email') || 'N/A';
        const company = params.get('company') || 'N/A';

        document.getElementById('name').textContent = name;
        document.getElementById('phone').textContent = phone;
        document.getElementById('email').textContent = email;
        document.getElementById('company').textContent = company;

        // Make phone number and button trigger the phone dialer
        if (phone !== 'N/A') {
            const telUrl = `tel:${phone}`;
            document.getElementById('phone-link').href = telUrl;
            document.getElementById('call-action-btn').href = telUrl;
        } else {
            document.getElementById('call-action-btn').style.display = 'none';
        }

        // Make email clickable
        if (email !== 'N/A') {
            document.getElementById('email-link').href = `mailto:${email}`;
        }
    </script>
</body>
</html>
